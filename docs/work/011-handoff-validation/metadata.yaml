id: W-011
slug: 011-handoff-validation
title: "Validate the late ASR provenance changes; close fetch storm and no-ASR degradation"
tier: L
tier_rationale: >
  Touches the rhythm source (QT.cues provenance), the timedtext fetch
  authority, and the Pace Lock / Trim gating. A wrong adoption pins WPM to
  cue-level timings for a whole video; a wrong fetch guard reproduces the
  measured request storm. Path floor L (QUALITY.md §3).

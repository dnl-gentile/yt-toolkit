id: W-017
slug: 017-searchapp-marker
title: "Presence marker on the quiet page, so the update notice can skip current users"
tier: S
tier_rationale: >
  Single module, additive, guarded, covered by a test that fails without it.
  No player code, no WPM math, nothing that can freeze a tab.
status: implemented
paths_owned:
  - content_script_searchapp.js
  - tests/integration/searchapp-marker.test.js
  - docs/work/017-searchapp-marker/
notes: >
  Consumed by the yt-search-bar site, which shows an update notice only when the
  old extension is detected. Removing the marker does not break this repo — it
  breaks the other one, silently, by nagging users who already updated. Hence
  the test.

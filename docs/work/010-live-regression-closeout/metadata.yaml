  - playwright.config.js
  - .github/workflows/ci.yml
notes: >
  Failures reproduced 2026-08-20: CC OFF returned ON, 319 timedtext requests
  in 8 seconds, label-only language rows received no colored check, native
  click escaped and closed the menu, Playback speed remained visible, manual
  rate changes left the current clock stale, and miniplayer could hide every
  clock or show two. Implementation is green in fixtures and disposable live;
  Shorts now also mounts the singleton pace pill in the active player's free
  top-center lane. Real-profile A → B/C acceptance is closed: original-language
  ASR kept 400 WPM with CC off while caption, pace, and trim preferences
  persisted; the user's original CC/Dual state was restored afterward.

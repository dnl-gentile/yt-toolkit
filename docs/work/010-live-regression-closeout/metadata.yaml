id: W-010
slug: 010-live-regression-closeout
title: "Close live WPM, Dual Subtitles, and menu-click regressions"
tier: L
tier_rationale: >
  ASR acquisition controls WPM, Pace Lock, Trim, and clock. The same patch
  touches the live YouTube captions/settings DOM and must preserve CC state,
  selected caption state, and the host menu. Path floor L.
status: implemented
supersedes:

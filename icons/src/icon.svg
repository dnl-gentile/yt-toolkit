<!--
  YouTube Toolkit card icon — the single source for icons/icon{16,48,128}.png.
  Copyright (C) 2025  Daniel Gentile
  SPDX-License-Identifier: GPL-3.0-or-later

  docs/SPEC.md §1: red YouTube square + white wrench (Material `build`).

  Regenerate with `npm run icons`; verify with `npm run icons:check`. Never
  hand-edit the PNGs. The set this replaced was a bitmap composite that left a
  ghost of the old circle-with-slash icon behind the wrench and blurred badly,
  because the larger sizes had been upscaled from a smaller one.

  Geometry note: an earlier revision used YouTube's 28:20 play-button badge.
  It looked right at 128px and failed at 16px — the wasted vertical space left
  the wrench 5x4 pixels, which is unreadable in the Chrome toolbar. A square
  tile is both what the spec says and what survives the smallest size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Red tile. Corner radius ~23% of the side, the ratio Chrome's own app tiles use. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#FF0000"/>

  <!--
    Material Symbols `build`, 24x24 viewport, scaled 3.25x to 78px and centred.
    Kept as the untouched official path: at 16px any editorialising turns to
    mush, and the silhouette is the only thing that still reads.
  -->
  <g transform="translate(25 25) scale(3.25)" fill="#FFFFFF">
    <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
  </g>
</svg>
